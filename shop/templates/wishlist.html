{% extends 'base.html' %}

{% block content %}
    <main class="main">
        <div class="page-header breadcrumb-wrap">
            <div class="container">
                <div class="breadcrumb">
                    <a href="index.html" rel="nofollow"><i class="fi-rs-home mr-5"></i>Home</a>
                    <span></span> Shop <span></span> Fillter
                </div>
            </div>
        </div>
        <div class="container mb-30 mt-50">
            <div class="row">
                <div class="col-xl-10 col-lg-12 m-auto">
                    <div class="mb-50">
                        <h1 class="heading-2 mb-10">Ваш лист ожиданий</h1>
                        <h6 class="text-body">There are <span class="text-brand">5</span> products in this list</h6>
                    </div>
                    <div class="table-responsive shopping-summery">
                        <table class="table table-wishlist">
                            <thead>
                            <tr class="main-heading">
                                <th class="custome-checkbox start pl-30">
                                    <input class="form-check-input" type="checkbox" name="checkbox"
                                           id="exampleCheckbox11" value=""/>
                                    <label class="form-check-label" for="exampleCheckbox11"></label>
                                </th>
                                <th scope="col" colspan="2">Товар</th>
                                <th scope="col">Цена</th>
                                <th scope="col">Stock Status</th>
                                <th scope="col">Action</th>
                                <th scope="col" class="end">Remove</th>
                            </tr>
                            </thead>
                            <tbody>
                            {% for w in wishlist %}
                                <tr class="pt-30">
                                    <td class="custome-checkbox pl-30">
                                        <input class="form-check-input" type="checkbox" name="checkbox"
                                               id="exampleCheckbox1" value=""/>
                                        <label class="form-check-label" for="exampleCheckbox1"></label>
                                    </td>
                                    <td class="image product-thumbnail pt-40"><img
                                            src="{{ w.product.main_image.url }}" alt="#"/></td>
                                    <td class="product-des product-name">
                                        <h6><a class="product-name mb-10"
                                               href="{{ w.product.get_absolute_url }}">{{ w.product.name }}</a></h6>
                                        <div class="product-rate-cover">
                                            <div class="product-rate d-inline-block">
                                                <div class="product-rating" style="width: 90%"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="price" data-title="Price">
                                        <h3 class="text-brand">${{ w.product.price }}</h3>
                                    </td>
                                    <td class="text-center detail-info" data-title="Stock">
                                        <span class="stock-status in-stock mb-0"> In Stock </span>
                                    </td>

                                    <td class="text-right" data-title="Cart">
                                        <form method="post" action="{% url 'cart:cart_add' w.product.id %}"
                                              class="cart-form">
                                            {% csrf_token %}

                                            <input  type="hidden" id="quantity" name="quantity" value="1"
                                                    class="quantity-input">


                                            <button class="btn btn-sm">Add to cart</button>
                                        </form>
                                    </td>
                                    <td class="action text-center" data-title="Remove">
                                        <a href="{% url 'shop:remove_wishlist' w.product.id %}" class="text-body"><i
                                                class="fi-rs-trash"></i></a>
                                    </td>
                                </tr>
                            {% endfor %}

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
